name: LPS QR compatibility
on:
  pull_request:
    paths:
      - "src/lib/lps-qr-*"
      - "src/app/api/qr/**"
      - "src/components/WeighingWorkspace.tsx"
      - "tests/lps-qr-identity.test.mjs"
      - "package.json"
      - ".github/workflows/lps-qr-compat.yml"
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
      - run: npm ci
      - run: npm run test:qr
      - run: npm run typecheck
      - run: npm run build
