<!doctype html><html lang="id"><head><meta charset="utf-8"><title>TimbangQR Bridge</title><style>body{font:16px system-ui;margin:30px;background:#101827;color:#eef}input,select,button{padding:10px;margin:6px 0;width:100%;box-sizing:border-box}button{background:#05815a;color:white;border:0;border-radius:6px;font-weight:700}.card{max-width:620px;margin:auto;background:#19263b;padding:24px;border-radius:12px}small{color:#acc}pre{white-space:pre-wrap;background:#0b1320;padding:12px;border-radius:8px}</style></head><body><main class="card"><h1>TimbangQR Bridge</h1><p>Bridge berjalan otomatis di komputer operator. Konfigurasi ini hanya dilakukan saat pemasangan atau pergantian perangkat.</p><label>URL API TimbangQR<input id="url" placeholder="https://timbangqr.domain/api/serial/ingest"></label><label>ID Perangkat<input id="device"></label><label>Serial API Key<input id="serialKey" type="password" placeholder="isi bila perlu diganti"></label><label>Bridge Admin Key<input id="bridgeKey" type="password" placeholder="isi bila perlu diganti"></label><button id="save">Simpan konfigurasi</button><hr><label>COM Port<select id="port"></select></label><label>Baud rate<select id="baud"><option>9600</option><option>4800</option><option>1200</option></select></label><button id="refresh">Deteksi port</button><button id="connect">Hubungkan timbangan</button><button id="disconnect">Putuskan</button><h3>Status</h3><pre id="status">Memuat…</pre></main><script>const $=id=>document.getElementById(id);async function show(){ $('status').textContent=JSON.stringify(await window.bridge.status(),null,2)}async function ports(){let paths=['COM1'];try{let p=await window.bridge.ports();for(const item of p){let value=String(item.path||'').trim();if(value&&!paths.some(x=>x.toUpperCase()===value.toUpperCase()))paths.push(value)}}catch{}$('port').innerHTML=paths.map(path=>'<option>'+path+'</option>').join('');$('port').value='COM1'}async function init(){let c=await window.bridge.getConfig();$('url').value=c.ingestUrl;$('device').value=c.deviceId;await ports();await show()}$('save').onclick=async()=>{await window.bridge.saveConfig({ingestUrl:$('url').value.trim(),deviceId:$('device').value.trim(),serialApiKey:$('serialKey').value||undefined,bridgeAdminKey:$('bridgeKey').value||undefined});await show()};$('refresh').onclick=ports;$('connect').onclick=async()=>{await window.bridge.connect({path:$('port').value,baudRate:Number($('baud').value),dataBits:8,stopBits:1,parity:'none',interfaceType:'RS232',frameMode:'line',delimiter:'\\r\\n'});await show()};$('disconnect').onclick=async()=>{await window.bridge.disconnect();await show()};init();setInterval(show,3000);</script></body></html>
